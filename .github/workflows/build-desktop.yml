name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (required). CI will bump, commit, tag, push, then build."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Bump version, commit, tag, push.
  #         Outputs the new tag/version for downstream jobs.
  # ──────────────────────────────────────────────────────────────
  prepare:
    name: Bump & Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.bump.outputs.release_tag }}
      release_version: ${{ steps.bump.outputs.release_version }}
      release_name: ${{ steps.bump.outputs.release_name }}
      release_sha: ${{ steps.bump.outputs.release_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Auro Git
        id: gitsetup
        uses: ./.github/actions/setup-auro-git
        with:
          auro-app-id: ${{ vars.AURO_APP_ID }}
          auro-app-key: ${{ secrets.AURO_APP_KEY }}

      - name: Bump on PR branch, merge, tag
        id: bump
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.gitsetup.outputs.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Sanity: must be on a branch (refs/heads/*) — refuse to run on a tag/PR.
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "::error::This workflow must be dispatched from a branch (got: ${GITHUB_REF})."
            exit 1
          fi
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"

          # bump-version.mjs has no runtime deps, but `pnpm bump:<type>` resolves
          # the script through pnpm's workspace filter, which needs the package
          # graph. Do NOT use --frozen-lockfile here: this job's whole purpose
          # is to mutate the lockfile, and main may already carry a lockfile
          # that's out of sync (e.g. left over from a failed previous run).
          pnpm install --no-frozen-lockfile --prefer-offline

          # Read current version BEFORE bumping.
          CUR_VER="$(node -p "require('./apps/app/package.json').version")"
          echo "Current version: $CUR_VER"

          # Run the bump script. It mutates 7 files in-place.
          pnpm bump:"$BUMP_TYPE"

          NEW_VER="$(node -p "require('./apps/app/package.json').version")"
          NEW_TAG="v${NEW_VER}"
          echo "New version: $NEW_VER"
          echo "New tag:     $NEW_TAG"

          # bump-version.mjs updates apps/orchestrator/package.json's
          # `aurowork-server` workspace dependency to the new version, which
          # invalidates pnpm-lock.yaml. Refresh the lockfile so the downstream
          # `pnpm install --frozen-lockfile` in the build job succeeds.
          pnpm install --lockfile-only

          # Guard 1: new version must differ from old.
          if [ "$CUR_VER" = "$NEW_VER" ]; then
            echo "::error::Bump produced the same version ($CUR_VER). Aborting."
            exit 1
          fi

          # Guard 2: new tag must not already exist on remote.
          if git ls-remote --tags origin "refs/tags/${NEW_TAG}" | grep -q .; then
            echo "::error::Tag ${NEW_TAG} already exists on origin. Aborting."
            exit 1
          fi

          # Guard 3: new version must be strictly greater than the largest existing v* tag.
          LARGEST="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LARGEST" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$LARGEST" "$NEW_TAG" | sort -V | tail -n1)"
            if [ "$HIGHEST" != "$NEW_TAG" ] || [ "$LARGEST" = "$NEW_TAG" ]; then
              echo "::error::New tag ${NEW_TAG} is not strictly greater than existing ${LARGEST}."
              exit 1
            fi
          fi

          # Stage everything bump-version.mjs touched. The release script will
          # commit them on the PR branch.
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changes to commit after bump — bump-version.mjs did nothing."
            exit 1
          fi

          # Hand off: branch + commit + push + open PR + watch checks +
          # admin-squash-merge + tag merge SHA + push tag + emit outputs.
          BASE_BRANCH="$BRANCH" \
          NEW_VER="$NEW_VER" \
          NEW_TAG="$NEW_TAG" \
            bash scripts/release/open-merge-release-pr.sh

      - name: Forward prerelease flag
        id: meta
        shell: bash
        run: |
          echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Job 2: Create GitHub Release for the freshly-pushed tag.
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Create Release
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup Auro Git
        id: gitsetup
        uses: ./.github/actions/setup-auro-git
        with:
          auro-app-id: ${{ vars.AURO_APP_ID }}
          auro-app-key: ${{ secrets.AURO_APP_KEY }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.gitsetup.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.release_tag }}"
          NAME="${{ needs.prepare.outputs.release_name }}"
          TARGET_SHA="${{ needs.prepare.outputs.release_sha }}"

          echo "Release tag:    $TAG"
          echo "Release name:   $NAME"
          echo "Target commit:  $TARGET_SHA"

          # Check if release already exists (e.g. previous run partially succeeded)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          flags=()
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            flags+=( --prerelease )
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NAME" \
            --notes "Desktop build for $TAG" \
            --target "$TARGET_SHA" \
            "${flags[@]}"

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build desktop app (Windows only)
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, create-release]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 180

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      AURO_GITHUB_REPO: ${{ vars.AURO_GITHUB_REPO || 'Northern-Deep-Leviathan/auro' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            os_type: windows
            target: x86_64-pc-windows-msvc
            auro_asset: auro-windows-x64-baseline.zip
            bundles: "msi"

    steps:
      # ── Checkout the bumped commit (NOT github.sha, which is pre-bump) ──
      - name: Checkout bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      # ── Windows: enable long paths ───────────────────────────
      - name: Enable long paths
        shell: bash
        run: git config --global core.longpaths true

      - name: Setup Auro Git
        id: gitsetup
        uses: ./.github/actions/setup-auro-git
        with:
          auro-app-id: ${{ vars.AURO_APP_ID }}
          auro-app-key: ${{ secrets.AURO_APP_KEY }}

      # ── Toolchain setup ──────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Caching ──────────────────────────────────────────────
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-

      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-${{ matrix.target }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-${{ matrix.target }}-cargo-

      # ── Install dependencies ─────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # ── Download Auro sidecar ────────────────────────────
      - name: Resolve Auro version
        id: auro-version
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('./constants.json', 'utf8'));
          const version = String(parsed.auroVersion || '').replace(/^v/, '').trim();
          if (!version) {
            throw new Error('Pinned Auro version is missing from constants.json');
          }
          console.log('version=' + version);
          NODE

      - name: Download Auro sidecar
        shell: bash
        env:
          PINNED_AURO_VERSION: ${{ steps.auro-version.outputs.version }}
        run: |
          set -euo pipefail

          echo "Installed Auro version: $PINNED_AURO_VERSION"
          repo="${AURO_GITHUB_REPO:-Northern-Deep-Leviathan/auro}"
          asset="${{ matrix.auro_asset }}"
          url="https://github.com/${repo}/releases/download/v${PINNED_AURO_VERSION}/${asset}"

          tmp_dir="$RUNNER_TEMP/auro"
          extract_dir="$tmp_dir/extracted"
          rm -rf "$tmp_dir"
          mkdir -p "$extract_dir"

          echo "Downloading ${url} ..."
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp_dir/$asset" "$url"

          if command -v unzip >/dev/null 2>&1; then
            unzip -q "$tmp_dir/$asset" -d "$extract_dir"
          elif command -v 7z >/dev/null 2>&1; then
            7z x "$tmp_dir/$asset" -o"$extract_dir" >/dev/null
          else
            echo "No unzip utility available" >&2
            exit 1
          fi

          if [ -f "$extract_dir/auro.exe" ]; then
            bin_path="$extract_dir/auro.exe"
          else
            echo "Auro binary not found in archive" >&2
            ls -la "$extract_dir"
            exit 1
          fi

          target_name="auro-${{ matrix.target }}.exe"
          mkdir -p apps/desktop/src-tauri/sidecars
          cp "$bin_path" "apps/desktop/src-tauri/sidecars/${target_name}"
          chmod 755 "apps/desktop/src-tauri/sidecars/${target_name}"

      # ── Purge stale bundle artifacts ─────────────────────────
      # Cache cargo restores apps/desktop/src-tauri/target, which may include
      # leftover bundles (e.g. `AuroWork_<old-version>_x64_en-US.msi.sig`).
      # If those linger, the Upload step below can pick them up via glob and
      # publish the wrong-version signature to the new release. Keep the
      # compile cache (target/<triple>/release/{deps,build,...}) but wipe the
      # bundle output so each run starts from a clean slate.
      - name: Purge stale bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$bundle_root" ]; then
            echo "Removing stale bundle artifacts at $bundle_root"
            rm -rf "$bundle_root"
          fi

      # ── Build + publish to release ───────────────────────────
      - name: Build + publish to release
        uses: tauri-apps/tauri-action@v0.5.17
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.gitsetup.outputs.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: "Desktop build for ${{ env.RELEASE_TAG }}"
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri -vvv
          args: "--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"
          retryAttempts: 3

      # ── Upload .sig + latest.json for updater ────────────────
      # tauri-action@v0.5.17 uploads MSI but skips the standalone .sig file.
      # We upload it manually, then generate latest.json so the updater works.
      - name: Upload signature + latest.json
        if: needs.prepare.outputs.prerelease != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gitsetup.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          # Point Tauri updater at the Azure mirror so download URLs are
          # reachable from regions where GitHub is slow/blocked. The
          # sync-release-to-azure workflow mirrors the same release assets.
          AUROWORK_AZURE_BASE_URL: ${{ vars.AUROWORK_AZURE_BASE_URL }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::Bundle directory not found: $BUNDLE_DIR"
            exit 1
          fi

          # IMPORTANT: pin the .sig filename to the version we just bumped.
          # A glob like `*.msi.sig` could match a stale signature left behind
          # by a previous run (Cache cargo restores target/, which includes
          # bundle/). That stale sig would be uploaded under its own name and
          # break generate-latest-json.mjs, which expects the new-version sig.
          SIG_FILE="$BUNDLE_DIR/AuroWork_${RELEASE_VERSION}_x64_en-US.msi.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Expected signature not found: $SIG_FILE"
            echo "Bundle directory contents:"
            ls -la "$BUNDLE_DIR"
            exit 1
          fi

          echo "Uploading signature: $SIG_FILE"
          gh release upload "$RELEASE_TAG" "$SIG_FILE" \
            --repo "$GITHUB_REPOSITORY" --clobber

          echo "Generating latest.json for tag $RELEASE_TAG ..."
          node scripts/release/generate-latest-json.mjs \
            --tag "$RELEASE_TAG" --output latest.json
          cat latest.json

          echo "Uploading latest.json ..."
          gh release upload "$RELEASE_TAG" latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
