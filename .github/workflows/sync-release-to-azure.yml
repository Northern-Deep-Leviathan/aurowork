name: Sync release to Azure Blob

on:
  # NOTE: `release: published` trigger has been intentionally removed.
  # The desktop build pipeline (build-desktop.yml) now invokes this
  # workflow via `workflow_call` AFTER all release assets are uploaded,
  # eliminating the race condition where sync fired before MSI/sig/
  # latest.json were attached to the release.
  #
  # For orchestrator/auro tag releases, or to backfill any past tag,
  # use the `workflow_dispatch` entry below.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.14.5)"
        required: true
      prefix:
        description: "Destination prefix in blob"
        required: true
        default: "desktop"
        type: choice
        options:
          - desktop
          - orchestrator
          - auro
  workflow_call:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.14.6)"
        required: true
        type: string
      prefix:
        description: "Destination prefix in blob (desktop | orchestrator | auro)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # The `release` environment is kept on purpose: it pins the OIDC
    # token subject to `repo:.../environment:release`, which matches the
    # federated credential on the aurowork-release-sync service
    # principal. Required reviewers should NOT be configured on this
    # environment — we want sync to run unattended after every desktop
    # build (invoked via workflow_call from build-desktop.yml) or
    # whenever an operator dispatches it manually. OIDC + an SP scoped
    # to a single storage account is the security boundary.
    environment: release
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag and prefix
        id: vars
        env:
          # Both `workflow_dispatch` and `workflow_call` expose their
          # inputs via the `inputs` context, so a single code path
          # handles both trigger types.
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          PREFIX="$INPUT_PREFIX"
          if [ -z "$TAG" ] || [ -z "$PREFIX" ]; then
            echo "::error::tag and prefix inputs are required"
            exit 1
          fi
          case "$PREFIX" in
            desktop|orchestrator|auro) ;;
            *)
              echo "::error::Unrecognized prefix: $PREFIX (expected desktop|orchestrator|auro)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG prefix=$PREFIX"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_BLOB_CONTAINER: ${{ vars.AZURE_BLOB_CONTAINER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/sync-to-azure.mjs \
            --tag "${{ steps.vars.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --prefix "${{ steps.vars.outputs.prefix }}"

      - name: Publish desktop latest.json alias
        if: steps.vars.outputs.prefix == 'desktop'
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.AZURE_BLOB_CONTAINER }}
          PREFIX: ${{ steps.vars.outputs.prefix }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # Copy versioned latest.json to stable alias path used by Tauri updater
          az storage blob copy start \
            --account-name "$ACCOUNT" \
            --destination-container "$CONTAINER" \
            --destination-blob "${PREFIX}/latest/latest.json" \
            --source-uri "https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}/${PREFIX}/${TAG}/latest.json" \
            --auth-mode login

      - name: Verification curl
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.AZURE_BLOB_CONTAINER }}
          PREFIX: ${{ steps.vars.outputs.prefix }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$PREFIX" = "desktop" ]; then
            URL="https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}/${PREFIX}/${TAG}/latest.json"
            echo "Verifying $URL"
            curl -fsSL -I "$URL"
          fi
          echo "Sync complete."
